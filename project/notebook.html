<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakez Notebook</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111c28;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            color: #00ffcc;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .export-btn {
            background: none;
            border: none;
            color: #00ffcc;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .export-btn:hover {
            background: rgba(0, 255, 204, 0.1);
        }

        .header-icon {
            margin-right: 8px;
            display: flex;
        }

        #notebook-area {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 15px;
            resize: none;
            outline: none;
            font-family: sans-serif;
            font-size: 15px;
            line-height: 1.5;
            box-sizing: border-box;
            width: 100%;
        }

        #notebook-area::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3); 
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00ffcc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 3h11a2 2 0 0 1 2 2v16l-3.5-2.2L11 21l-3.5-2.2L4 21V5a2 2 0 0 1 1-1.7z"/>
                    <line x1="8" y1="8" x2="14" y2="8"/>
                    <line x1="8" y1="12" x2="14" y2="12"/>
                </svg>
            </div>
            Rakez Notebook
        </div>
        <button class="export-btn" id="export-btn" title="Export Notes">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
        </button>
    </div>
    <textarea id="notebook-area" placeholder="Type your session notes here... Auto-saved."></textarea>

    <script src="../js/notebook.js"></script>
</body>
</html>
