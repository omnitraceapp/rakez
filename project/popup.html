<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/popup.css">
</head>
<body>
  <div class="popup-container">

    <div id="popup-idle">
      <div class="mode-selector">
        <button type="button" class="mode-btn active" id="mode-study" data-mode="study">🎓 Study</button>
        <button type="button" class="mode-btn" id="mode-work" data-mode="work">💼 Work</button>
      </div>
      <div class="input-group">
        <label for="intention" id="intention-label">What are you studying?</label>
        <input type="text" id="intention" placeholder="e.g. Learning JS Closures">
      </div>
      <button class="btn-start">Start Session</button>
    </div>

    <div id="popup-active" class="hidden">
      <div class="status-box">
        <span class="status-mode-badge" id="active-mode-badge">🎓 Studying</span>
        <p class="status-label">Goal:</p>
        <p class="current-intention">Learning JS Closures</p>
      </div>

      <div id="ai-eval-box" style="margin-bottom: 12px; padding: 10px; border-radius: 8px; background: rgba(0, 255, 204, 0.08); border: 1px solid rgba(0, 255, 204, 0.25); text-align: left;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
          <span id="ai-eval-status" style="font-weight: 700; font-size: 12px; color: #00ffcc;">🟢 100% On-Task</span>
          <span id="ai-eval-badge" style="font-size: 10px; opacity: 0.8; padding: 2px 6px; border-radius: 4px; background: rgba(0, 255, 204, 0.2); color: #00ffcc;">Live AI</span>
        </div>
        <p id="ai-eval-reason" style="margin: 0; font-size: 11px; color: #cbd5e1; line-height: 1.35;">Evaluating page content...</p>
      </div>

      <button class="btn-pause">Pause Session</button>
      <button class="btn-end">End Session</button>
    </div>

    <footer>
      <button class="btn-dashboard">Open Dashboard</button>
    </footer>
  </div>
  <script src="../js/popup.js"></script>
</body>
</html>
